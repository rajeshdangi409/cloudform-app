<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Submission Successful</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .success-card {
            width: 420px;
            background: white;

            padding: 45px 35px;

            border-radius: 20px;

            text-align: center;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        .success-icon {
            width: 80px;
            height: 80px;

            margin: 0 auto 25px;

            border-radius: 50%;

            background: #e8f8ee;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 42px;
        }

        h1 {
            color: #222;
            margin-bottom: 12px;
        }

        .message {
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .user-name {
            color: #667eea;
            font-weight: bold;
        }

        .status {
            display: inline-block;

            padding: 8px 18px;

            border-radius: 20px;

            background: #e8f8ee;
            color: #218838;

            font-size: 14px;
            font-weight: bold;

            margin-bottom: 30px;
        }

        .home-button {
            display: inline-block;

            width: 100%;

            padding: 14px;

            border-radius: 8px;

            background: linear-gradient(135deg, #667eea, #764ba2);

            color: white;

            text-decoration: none;

            font-weight: bold;

            transition: 0.3s;
        }

        .home-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(102, 126, 234, 0.35);
        }

        .footer {
            margin-top: 25px;

            font-size: 12px;

            color: #aaa;
        }
    </style>

</head>

<body>

    <div class="success-card">

        <div class="success-icon">
            ✓
        </div>

        <span class="status">
            ✓ Submission Successful
        </span>

        <h1>Thank You!</h1>

        <p class="message">
            Hi <span class="user-name">{{ name }}</span>,
            your information has been successfully submitted
            and stored in our database.
        </p>

        <a href="/" class="home-button">
            ← Back to Home
        </a>

        <div class="footer">
            Flask • AWS RDS • DevOps Practice Project
        </div>

    </div>

</body>

</html>
